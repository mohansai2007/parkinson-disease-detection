[theme]
base            = "dark"
backgroundColor         = "#03091a"
secondaryBackgroundColor = "#060f28"
primaryColor    = "#00f5d4"
textColor       = "#e2e8f0"
font            = "sans serif"

[server]
headless        = true
enableCORS      = false
enableXsrfProtection = false
maxUploadSize   = 50

[browser]
gatherUsageStats = false
